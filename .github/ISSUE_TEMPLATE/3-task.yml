name: Задача (Task)
description: Техническая задача внутри элемента бэклога
type: Task
body:
  - type: textarea
    id: what
    attributes:
      label: Что сделать
    validations:
      required: true
  - type: dropdown
    id: activity
    attributes:
      label: Активность
      options: ["Разработка", "Дизайн", "Тестирование", "Документация", "Развёртывание", "Требования"]
    validations:
      required: true
  - type: input
    id: remaining
    attributes:
      label: Оставшаяся работа, ч
      placeholder: "3"
